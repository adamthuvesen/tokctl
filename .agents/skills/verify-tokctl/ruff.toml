# The shared stack settings (agents/stack/stack.toml). This repo has no pyproject.toml.
line-length = 100
target-version = "py314"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "PGH003"]
# The formatter owns line length; E501 would only flag strings and comments it cannot wrap.
ignore = ["E501"]

[format]
quote-style = "double"
