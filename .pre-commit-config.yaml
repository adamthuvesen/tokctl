repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: just fmt
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: just lint
        language: system
        files: '(^Cargo\.(toml|lock)$|\.rs$)'
        pass_filenames: false
