name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: pinned
          - os: macos-latest
            toolchain: pinned
          - os: ubuntu-latest
            toolchain: msrv
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve toolchain
        id: rust-version
        env:
          TOOLCHAIN_KIND: ${{ matrix.toolchain }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import tomllib
          from pathlib import Path
          if os.environ["TOOLCHAIN_KIND"] == "msrv":
              version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["rust-version"]
          else:
              version = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          print(f"version={version}")
          PY
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked --version 1.45.0
      - name: Verify
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-version.outputs.version }}
        run: just check
