name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: pinned
          - os: macos-latest
            toolchain: pinned
          - os: ubuntu-latest
            toolchain: msrv
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve toolchain
        id: rust-version
        env:
          TOOLCHAIN_KIND: ${{ matrix.toolchain }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import tomllib
          from pathlib import Path
          if os.environ["TOOLCHAIN_KIND"] == "msrv":
              version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["rust-version"]
          else:
              version = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          print(f"version={version}")
          PY
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16), no release tags
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install just
        run: cargo install just --locked --version 1.45.0
      # check lints the Python verify script with `uvx ruff`.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Check
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-version.outputs.version }}
        run: just check
      - name: Verify
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-version.outputs.version }}
        run: just slow
      - name: Drive the binary
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-version.outputs.version }}
        run: |
          just verify all
          just verify control
